services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: impression
      POSTGRES_PASSWORD: impression
      POSTGRES_DB: impression
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impression"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
