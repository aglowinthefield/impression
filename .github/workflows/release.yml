name: release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: impression
          POSTGRES_PASSWORD: impression
          POSTGRES_DB: impression
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U impression" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Tag matches package version
        run: test "v$(node -p "require('./packages/impression/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        working-directory: packages/impression
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
