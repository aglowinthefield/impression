name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: impression
          POSTGRES_PASSWORD: impression
          POSTGRES_DB: impression
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U impression" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The server image runs only the API and web UI. Skip the deploy when a push
      # touches none of their files, such as a README or CLI-only change. Deploy
      # when the previous commit is unknown (first push, force-push).
      - id: changed
        env: { BEFORE: "${{ github.event.before }}" }
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null ||
            ! git diff --quiet "$BEFORE" HEAD -- packages/api packages/web packages/shared \
              Dockerfile .dockerignore fly.toml package.json pnpm-lock.yaml \
              pnpm-workspace.yaml tsconfig.base.json turbo.json; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No server changes since $BEFORE, skipping deploy."
          fi
      - if: steps.changed.outputs.deploy == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.changed.outputs.deploy == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
